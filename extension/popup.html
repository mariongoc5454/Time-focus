<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusQuest Monitor</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d1117;
      color: #e6edf3;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid #30363d;
      padding-bottom: 10px;
    }
    .logo-icon {
      font-size: 24px;
    }
    h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      color: #58a6ff;
    }
    .status-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .status-row:last-child {
      margin-bottom: 0;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .connected {
      background: rgba(46, 160, 67, 0.15);
      color: #3fb950;
      border: 1px solid rgba(46, 160, 67, 0.4);
    }
    .connected .badge-dot {
      background: #3fb950;
    }
    .disconnected {
      background: rgba(248, 81, 73, 0.15);
      color: #f85149;
      border: 1px solid rgba(248, 81, 73, 0.4);
    }
    .disconnected .badge-dot {
      background: #f85149;
    }
    .studying {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.4);
    }
    .paused {
      background: rgba(234, 179, 8, 0.15);
      color: #eab308;
      border: 1px solid rgba(234, 179, 8, 0.4);
    }
    .form-group {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 11px;
      color: #8b949e;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      padding: 6px 10px;
      font-size: 12px;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #58a6ff;
    }
    .btn {
      width: 100%;
      background: #238636;
      color: #ffffff;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #2ea043;
    }
    .btn-secondary {
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      margin-top: 8px;
    }
    .btn-secondary:hover {
      background: #30363d;
    }
    .privacy-notice {
      margin-top: 12px;
      font-size: 11px;
      color: #8b949e;
      line-height: 1.4;
      border-top: 1px solid #21262d;
      padding-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo-icon">🛡️</span>
    <h2>FocusQuest Shield</h2>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span>App Desktop:</span>
      <span id="conn-badge" class="badge disconnected">
        <span class="badge-dot"></span>
        <span id="conn-text">Mất kết nối</span>
      </span>
    </div>
    <div class="status-row">
      <span>Phiên học:</span>
      <span id="session-badge" class="badge">
        <span id="session-text">Chưa bắt đầu</span>
      </span>
    </div>
  </div>

  <div class="form-group">
    <label for="token-input">Secret Token:</label>
    <input type="text" id="token-input" value="focusquest_default_token">
  </div>

  <div class="form-group">
    <label for="url-input">Server Local URL:</label>
    <input type="text" id="url-input" value="http://127.0.0.1:48123">
  </div>

  <button id="save-btn" class="btn">Lưu Cấu Hình</button>
  <button id="check-btn" class="btn btn-secondary">Kiểm Tra Kết Nối</button>

  <div class="privacy-notice">
    🔒 <strong>Bảo mật:</strong> Chỉ gửi tên miền tới 127.0.0.1. Không lưu lịch sử, không gửi dữ liệu ra ngoài, không đọc nội dung riêng tư.
  </div>

  <script src="popup.js"></script>
</body>
</html>
